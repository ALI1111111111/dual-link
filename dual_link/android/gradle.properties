org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Project (D:) and pub cache (C:) are on different drives; Kotlin incremental caches break across drives.
kotlin.incremental=false

# Faster rebuilds: reuse outputs and build modules in parallel.
org.gradle.caching=true
org.gradle.parallel=true
# Free memory when idle: Gradle and Kotlin daemons exit after 15 minutes without builds.
org.gradle.daemon.idletimeout=900000
kotlin.daemon.options=autoshutdownIdleSeconds=900
