<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap');
html,body{margin:0;width:1200px;height:1200px;overflow:hidden}
body{background:#F2F7F5;font-family:"Bricolage Grotesque","Segoe UI",sans-serif;color:#13302D;position:relative}
.q{position:absolute;left:96px;top:120px;width:1000px;font-size:104px;line-height:1.02;font-weight:800;letter-spacing:-2px}
.q span{display:block;color:#5C6F6C;font-weight:500;font-size:64px;letter-spacing:-.5px;margin-top:28px;line-height:1.15}
.miss{position:absolute;left:96px;top:640px;width:560px;background:#fff;border-radius:28px;padding:30px 34px;box-shadow:0 18px 50px rgba(19,48,45,.12);font-size:34px}
.miss b{display:block;font-size:40px;color:#C8431F}
.miss small{color:#5C6F6C;font-size:28px}
.fix{position:absolute;left:96px;bottom:96px;right:96px;display:flex;align-items:center;gap:28px;background:#0B7A75;color:#fff;border-radius:32px;padding:34px 40px}
.fix svg{flex:none}
.fix div{font-size:44px;font-weight:800;line-height:1.1}
.fix div span{display:block;font-size:30px;font-weight:500;opacity:.92;margin-top:8px}
.otp{position:absolute;right:96px;top:690px;width:400px;background:#fff;border-radius:28px;padding:28px 32px;box-shadow:0 18px 50px rgba(19,48,45,.12);font-size:30px;transform:rotate(3deg)}
.otp b{display:block;font-size:34px} .otp em{font-style:normal;color:#C8431F;font-size:26px}
</style></head><body>
<div class="q">You missed a call.<br>You didn't even know it rang.<span>Your SIM was in the other phone.</span></div>
<div class="miss"><b>3 missed calls</b>Mom · 2 hours ago<br><small>on the phone in the drawer</small></div>
<div class="otp"><b>Your bank code: 482913</b><em>expired</em></div>

</body></html>
